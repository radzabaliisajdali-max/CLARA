<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CLARA V5 — запуск</title></head><body><h1>CLARA V5</h1><p>Эта версия работает с сервером и PostgreSQL. Открытие HTML-файла или GitHub Pages не запускает рабочую базу.</p><p>Настройте .env и выполните <code>docker compose up --build -d</code>.</p><p>Откройте <a href="http://localhost:3000">CLARA на localhost:3000</a>.</p><p><a href="README.md">Инструкция запуска</a></p></body></html>

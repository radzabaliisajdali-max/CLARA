name: CLARA checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test-only-password
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:test-only-password@localhost:5432/postgres
      POSTGRES_PASSWORD: ci-database-only-2026
      OWNER_LOGIN: ci-owner
      OWNER_PASSWORD: ci-owner-only-2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable && corepack prepare pnpm@11.19.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm build && pnpm test
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:ui
      - run: docker build -t clara-check .
      - name: Start Compose and verify app/database health
        run: |
          docker compose up --build -d --wait
          curl --fail --retry 20 --retry-connrefused --retry-delay 1 http://localhost:3000/health
      - name: Stop Compose
        if: always()
        run: docker compose down --volumes
